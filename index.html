<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>政策雷达 · 第一时间</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --ink:#1a1d21; --ink2:#5b6169; --ink3:#8b929b;
  --line:#e3e6ea; --accent:#2f6fed; --accent-soft:#e8efff;
  --g-国家:#6a5acd; --g-广东:#0f9d8f; --g-深圳:#e8590c; --g-媒体:#7c8794;
  --hot:#e03131; --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1116;--panel:#161b22;--ink:#e6edf3;--ink2:#9aa4b2;--ink3:#6b7480;
        --line:#232a33;--accent:#5b8cff;--accent-soft:#1b2740;
        --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);}
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}

.wrap{max-width:1320px;margin:0 auto;padding:20px 20px 80px}

/* ---------- header ---------- */
.top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.brand h1{margin:0;font-size:21px;letter-spacing:.5px;font-weight:700}
.brand h1 span{color:var(--accent)}
.brand p{margin:2px 0 0;color:var(--ink3);font-size:12px}
.stats{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 13px;min-width:78px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:19px;line-height:1.25;font-variant-numeric:tabular-nums}
.stat i{font-style:normal;font-size:11px;color:var(--ink3)}
.stat.hot b{color:var(--hot)}

/* ---------- toolbar ---------- */
.toolbar{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow);margin-bottom:14px;
  position:sticky;top:0;z-index:20;backdrop-filter:blur(8px)}
.search{flex:1 1 260px;position:relative}
.search input{width:100%;padding:9px 12px 9px 32px;border:1px solid var(--line);border-radius:9px;
  background:var(--bg);color:var(--ink);font-size:13px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search::before{content:"⌕";position:absolute;left:11px;top:6px;color:var(--ink3);font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg);
  font-size:12px;color:var(--ink2);transition:.15s;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .n{opacity:.65;margin-left:4px;font-size:11px}
.tgl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);
  padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
.tgl[aria-pressed="true"]{border-color:var(--hot);color:var(--hot)}
select{padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-size:12px;outline:none}

/* ---------- calendar ---------- */
.cal{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}
.cal-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.cal-head h2{margin:0;font-size:15px;font-weight:650;font-variant-numeric:tabular-nums}
.cal-head .sp{margin-left:auto;display:flex;gap:6px}
.nav{width:30px;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--bg);
  display:grid;place-items:center;font-size:15px;color:var(--ink2)}
.nav:hover{border-color:var(--accent);color:var(--accent)}
.gh{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--bg);border-bottom:1px solid var(--line)}
.gh span{padding:7px 8px;font-size:11px;color:var(--ink3);text-align:center;letter-spacing:.5px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(104px,auto)}
.grid>*{min-width:0}
.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 5px 6px;
  position:relative;min-height:104px;min-width:0;overflow:hidden;transition:background .12s}
.cell.off{background:rgba(224,49,49,.045)}
.cell.off .dn{color:var(--hot);font-weight:700}
.cell.work .dn{color:var(--ink3)}
.cell .fest{font-size:11px;font-weight:600;color:var(--hot);margin:-2px 0 2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.cell .fest.work{color:var(--ink3);font-weight:400}
.cell .fest.work::after{content:" 班";font-size:9px;border:1px solid var(--ink3);
  border-radius:3px;padding:0 2px;margin-left:2px;vertical-align:1px}
.gh span:nth-child(6),.gh span:nth-child(7){color:#e0546a}
.legend{display:flex;gap:12px;font-size:11px;color:var(--ink3);align-items:center}
.legend i{font-style:normal;display:inline-flex;align-items:center;gap:4px}
.legend b{width:9px;height:9px;border-radius:2px;display:inline-block}
.cell:nth-child(7n){border-right:none}
.cell:hover{background:var(--accent-soft)}
.cell.out{opacity:.38}
.cell.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.cell.today .dn{background:var(--accent);color:#fff;border-radius:50%;width:21px;height:21px;
  display:grid;place-items:center}
.dn{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;margin-bottom:3px}
.cell .ev{display:block;font-size:11px;line-height:1.35;padding:2px 5px;margin-bottom:2px;border-radius:5px;
  background:var(--bg);border-left:3px solid var(--g-深圳);color:var(--ink2);
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.cell .ev:hover{color:var(--ink);background:var(--accent-soft)}
.cell .ev[data-g="国家"]{border-left-color:var(--g-国家)}
.cell .ev[data-g="广东"]{border-left-color:var(--g-广东)}
.cell .ev[data-g="深圳"]{border-left-color:var(--g-深圳)}
.cell .ev[data-g="媒体"]{border-left-color:var(--g-媒体)}
.cell .more{font-size:10px;color:var(--accent);padding-left:5px;cursor:pointer}
.dl{position:absolute;right:4px;top:4px;font-size:9px;color:var(--hot);border:1px solid var(--hot);
  border-radius:4px;padding:0 3px;line-height:1.35}

/* ---------- list ---------- */
.daybar{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.daybar h3{margin:0;font-size:15px}
.daybar .clear{font-size:12px;color:var(--accent);border:1px solid var(--line);border-radius:7px;padding:3px 9px;background:var(--panel)}
.dgroup{margin-bottom:8px}
.dlabel{font-size:12px;color:var(--ink3);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.dlabel::after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:9px;
  box-shadow:var(--shadow);cursor:pointer;transition:.15s;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--g-深圳)}
.card[data-g="国家"]::before{background:var(--g-国家)}
.card[data-g="广东"]::before{background:var(--g-广东)}
.card[data-g="媒体"]::before{background:var(--g-媒体)}
.card:hover{transform:translateY(-1px);border-color:var(--accent)}
.ct{display:flex;gap:9px;align-items:flex-start}
.ct h4{margin:0;font-size:14px;font-weight:600;line-height:1.45;flex:1}
.badge{font-size:10px;padding:1px 7px;border-radius:5px;white-space:nowrap;font-weight:500}
.b-signal{background:var(--accent-soft);color:var(--accent)}
.b-hot{background:#ffe3e3;color:var(--hot)}
@media (prefers-color-scheme:dark){.b-hot{background:#3b1a1a}}
.b-dead{background:#fff4e6;color:#d9480f}
@media (prefers-color-scheme:dark){.b-dead{background:#3a2416}}
.cm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:11.5px;color:var(--ink3)}
.cm .src{color:var(--ink2)}
.stars{color:#f59f00;letter-spacing:1px}
.tag{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:0 6px;font-size:10.5px;color:var(--ink2)}
.sum{margin:7px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.55}
.act{margin:6px 0 0;font-size:12px;color:var(--ink2);border-left:2px solid var(--accent);padding-left:8px}
.empty{text-align:center;color:var(--ink3);padding:50px 0;font-size:13px}

/* ---------- drawer ---------- */
.mask{position:fixed;inset:0;background:rgba(10,12,16,.42);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,94vw);background:var(--panel);
  border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(0,0,0,.18);
  transform:translateX(102%);transition:transform .24s cubic-bezier(.4,0,.2,1);z-index:50;
  display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.dh h3{margin:0;font-size:16px;line-height:1.45;flex:1}
.x{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--bg);
  display:grid;place-items:center;color:var(--ink2);flex:0 0 auto}
.db{padding:16px 20px 40px;overflow:auto}
.kv{display:grid;grid-template-columns:88px 1fr;gap:8px 12px;font-size:13px;margin-bottom:16px}
.kv dt{color:var(--ink3);font-size:12px}
.kv dd{margin:0}
.sec{margin-bottom:16px}
.sec h5{margin:0 0 6px;font-size:11px;letter-spacing:1px;color:var(--ink3);font-weight:600}
.sec p{margin:0;font-size:13px;line-height:1.7;color:var(--ink)}
.goto{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;
  padding:9px 16px;border-radius:9px;font-size:13px;font-weight:500}
.srcs{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--ink3);margin-top:18px}
.srcs .pushinfo{margin-left:auto;color:var(--ink2);background:var(--panel);border:1px solid var(--line);
  border-radius:6px;padding:1px 8px}
.ok{color:#2f9e44}.bad{color:var(--hot)}
@media(max-width:760px){
  .stat{min-width:64px;padding:6px 10px}
  .grid{grid-auto-rows:minmax(76px,auto)}
  .cell .ev:nth-of-type(n+2){display:none}
  .wrap{padding:12px 10px 60px}
}
</style>
</head>

  <div class="top">

  <div class="daybar">
    <h3 id="listtitle">全部动态</h3>
    <button class="clear" id="clearday" hidden>取消日期筛选</button>

  <div id="list"></div>

  <div class="srcs" id="srchealth"></div>
</div>

<div class="mask" id="mask"></div>
<aside class="drawer" id="drawer" aria-hidden="true">

  <div class="db" id="dbody"></div>
</aside>

增值税及附加税费申报表业务信息表》； （三）《增值税及附加税费申报表主表》； （四）《增值税及附加税费申报表附列资料（一）》（本期销售情况明细表）及附"}, {"id": "8ed7f304da663405", "title": "关于《国家税务总局深圳市税务局关于开展增值税及附加税费申报试点的公告》的解读", "url": "https://shenzhen.chinatax.gov.cn/sztax/zcwj/zcjd/202610/e071b9730dcb4d70b38f45c2ccb2876d.shtml", "date": "2026-10-30", "src": "深圳市税务局 · 政策文件", "g": "深圳", "signal": "补贴申报", "tags": ["营商环境", "国家层面"], "imp": 4, "deadline": null, "summary": "为进一步提升增值税及附加税费申报服务和管理水平，国家税务总局修订了《增值税及附加税费申报表（试行）》（以下称新表），拟在深圳市开展试点", "impact": "直接影响营商环境、国家层面主体的资金可得性，涉及申报窗口、材料口径与兑现节奏。", "action": "核对申报条件与主体资格，倒排材料清单，卡住截止时间提交；错过窗口通常要等下一批。", "engine": "规则引擎", "col": "", "raw": "为进一步提升增值税及附加税费申报服务和管理水平，国家税务总局修订了《增值税及附加税费申报表（试行）》（以下称新表），拟在深圳市开展试点。为顺利推行试点工作，国家税务总局深圳市税务局制发了《国家税务总局深圳市税务局关于开展增值税及附加税费申报试点的公告》（以下简称《公告》），现将有关事项解读如下： 一、本次新表修订的背景是什么？ 为落实《中华人民共和国增值税法》、《中华人民共和国增值税法实施条例》及有关税收政策（以下称增值税新政），进一步提高服务和管理水平，结合信息技术能力提升，国家税务总局修订了新表。新表及其相关功能以实用性、简洁性、兼容性为设计理念，以全面承接、精准记录、有效规范政策规定为目标，将有助于提升增值税及附加税费申报服务的标准化、智能化、便利化水平。 二、试点工作的意义有哪些？ 为稳妥有序推广新表，国家税务总局选择部分地区开展试点。试点地区按照“双轨验证、单轨运行”的步骤，逐步"}, {"id": "6e33cb87bcf7332f", "title": "南山区政府工作报告（2026年8月24日）", "url": "https://www.szns.gov.cn/gkmlpt/content/13/13045/post_13045964.html", "date": "2026-10-30", "src": "南山区政府", "g": "深圳", "signal": "会议活动", "tags": ["南山"], "imp": 4, "deadline": null, "summary": "现在，我代表南山区人民政府，向大会报告政府工作，请予审议，并请各位政协委员和其他列席人员提出意见", "impact": "反映南山方向上的政策取向，属信号类信息。", "action": "了解精神与信号，判断后续配套政策方向；不必逐条处理。", "engine": "规则引擎", "col": "工作报告", "raw": "——2026年8月24日在深圳市南山区第九届人民代表大会第一次会议上 南山区区长 李小宁各位代表： 现在，我代表南山区人民政府，向大会报告政府工作，请予审议，并请各位政协委员和其他列席人员提出意见。 过去五年工作回顾 随着本次区人大会议的召开，本届区人民政府的..."}, {"id": "9ef7bd7a72889b93", "title": "国家医保谈判药品电子处方流转，让群众购药更便捷更省心", "url": "https://hsa.sz.gov.cn/gkmlpt/content/13/13047/post_13047763.html", "date": "2026-10-30", "src": "深圳市医保局", "g": "深圳", "signal": "其他动态", "tags": ["医疗"], "imp": 3, "deadline": null, "summary": "倾听市民心声，解答热点问题", "impact": "与医疗相关，影响程度待正文确认。", "action": "归档关注，判断是否与自身业务相关。", "engine": "规则引擎", "col": "在线访谈", "raw": "【主持人】：倾听市民心声，解答热点问题。各位嘉宾、各位网友，大家 7145db188c52", "title": "关于《国家税务总局关于发布〈全国税务行政处罚裁量基准（2026年版）〉的公告》的解读", "url": "https://shenzhen.chinatax.gov.cn/sztax/zcwj/zcjd/202609/b5a3def380e2456e9a646dc59a97fcb8.shtml", "date": "2026-09-28", "src": "深圳市税务局 · 政策文件", "g": "深圳", "signal": "公示公告", "tags": ["教育", "营商环境", "国家层面"], "imp": 3, "deadline": "2026-12-31", "summary": "一、《国家税务总局关于发布〈全国税务行政处罚裁量基准（2026年版）〉的公告》出台背景和重要意义是什么 规范税务执法行为、优化税务执法方式是税务部门依法治税的重要内容", "impact": "涉及教育、营商环境、国家层面具体主体资格与结果确认，属事实性信息。", "action": "核对名单中是否有自身或关联方；有异议的，在公示期内按程序提出。", "engine": "规则引擎", "col": "", "raw": "一、《国家税务总局关于发布〈全国税务行政处罚裁量基准（2026年版）〉的公告》出台背景和重要意义是什么 规范税务执法行为、优化税务执法方式是税务部门依法治税的重要内容。近年来，税务总局指导东北、西南、西北、中南、华北、华东等全国六大区域税务部门陆续制定了区域内统一的税务行政处罚裁量基准，在规范税务执法、维护纳税人权益、推进税收治理等方面发挥了积极作用，但也逐渐反映出一些问题，不完全符合维护法治公平、强化合规管理和加快推进全国统一大市场建设的要求。 为深入贯彻习近平法治思想，树立和践行正确政绩观，贯彻落实中共中央办公厅、国务院办公厅印发的《关于进一步深化税收征管改革的意见》和《国务院关于进一步规范和监督罚款设定与实施的指导意见》精神，规范税务行政处罚裁量权行使，推进全国税务执法标准统一，税务总局制发《国家税务总局关于发布〈全国税务行政处罚裁量基准（2026年版）〉的公告》（以下简称《公告》）"}, {"id": "ecdc95939aaba235", "title": "国家税务总局深圳市龙岗区税务局关于横岗税务所搬迁的通告", "url": "https://shenzhen.chinatax.gov.cn/sztax/xxgk/tzgg/202609/9376bf0d19f64569abadc68f43456f20.shtml", "date": "2026-09-28", "src": "深圳市税务局 · 通知公告", "g": "深圳", "signal": "公示公告", "tags": ["福田", "龙岗", "广东省"], "imp": 3, "deadline": null, "summary": "因工作需要，国家税务总局深圳市龙岗区税务局横岗税务所将搬迁办税场所", "impact": "涉及福田、龙岗、广东省具体主体资格与结果确认，属事实性信息。", "action": "核对名单中是否有自身或关联方；有异议的，在公示期内按程序提出。", "engine": "规则引擎", "col": "", "raw": "因工作需要，国家税务总局深圳市龙岗区税务局横岗税务所将搬迁办税场所。现将有关情况通告如下： 自2026年10月8日起，国家税务总局深圳市龙岗区税务局横岗税务所搬迁至深圳市龙岗区平湖街道守珍街136号，相应涉税（费）业务随之迁移，并从当日起提供办税服务。 届时原办公地址（深圳市龙岗区横岗街道深峰路深华街1号）将停止对外办理税费业务。 税务部门联系电话：0755-12366（转龙岗）。 因搬迁工作带来不便，敬请谅解。感谢对龙岗税务工作的支持与配合！ 特此通告。 国家税务总局深圳市龙岗区税务局 2026年9月24日 附件： 相关链接： 扫一扫在手机打开当前页 回到顶部 联系我们 网站地图 网站管理 访问统计 版权所有©国家税务总局深圳市税务局 网站标识码bm29360001 粤ICP备11010473号 粤公网安备44030402002874号 主办单位：国家税务总局深圳市税务局 地址：广东省深"}, {"id": "298656a8f9cd9a9d", "title": "电动自行车驾驶安全提醒", "url": "https://www.szgm.gov.cn/gkmlpt/content/13/13001/post_13001301.html", "date": "2026-09-28", "src": "光明区政府", "g" <script>
(function(){
  const $ = s => document.querySelector(s);
  const S = { q:'', groups:new Set(), onlyHot:false, tag:'', sig:'', day:null,
              month:(new Date()).getFullYear()+'-'+String((new Date()).getMonth()+1).padStart(2,'0') };

  const GROUPS = [...new Set(DATA.map(d=>d.g))];
  const HOL = META.holidays || {};
  const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const pad = n => String(n).padStart(2,'0');
  const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const TODAY = META.today || ymd(new Date());

  /* ---- stats ---- */
  function stats(){
    const today = DATA.filter(d=>d.date===TODAY).length;
    const week = DATA.filter(d=>{
      const t = new Date(TODAY+'T00:00:00'), x = new Date(d.date+'T00:00:00');
      const diff = (t-x)/86400000; return diff>=0 && diff<7;
    }).length;
    const soon = DATA.filter(d=>d.deadline && d.deadline>=TODAY &&
      (new Date(d.deadline)-new Date(TODAY))/86400000 <= 14).length;
    const hot = DATA.filter(d=>d.imp>=4).length;
    $('#stats').innerHTML = [
      ['今日新增', today, 'hot'], ['近 7 天', week, ''], ['14 天内截止', soon, soon?'hot':''],
      ['重点 ★4+', hot, ''], ['收录总数', DATA.length, '']
    ].map(([k,v,c])=>`<div class="stat ${c}"><b>${v}</b><i>${k}</i></div>`).join('');
  }

  /* ---- filters ---- */
  function buildChips(){
    const cnt = {}; DATA.forEach(d=>cnt[d.g]=(cnt[d.g]||0)+1);
    $('#srcchips').innerHTML = GROUPS.map(g=>
      `<button class="chip" data-g="${esc(g)}" aria-pressed="false">${esc(g)}<span class="n">${cnt[g]}</span></button>`
    ).join('');
    $('#srcchips').onclick = e=>{
      const b = e.target.closest('.chip'); if(!b) return;
      const g = b.dataset.g;
      S.groups.has(g) ? S.groups.delete(g) : S.groups.add(g);
      b.setAttribute('aria-pressed', S.groups.has(g));
      render();
    };
    const tags = [...new Set(DATA.flatMap(d=>d.tags))].sort();
    $('#tag').innerHTML = '<option value="">全部领域</option>' + tags.map(t=>`<option>${esc(t)}</option>`).join('');
    const sigs = [...new Set(DATA.map(d=>d.signal))].sort();
    $('#sig').innerHTML = '<option value="">全部类型</option>' + sigs.map(t=>`<option>${esc(t)}</option>`).join('');
  }

  function match(d){
    if(S.groups.size && !S.groups.has(d.g)) return false;
    if(S.onlyHot && d.imp<4) return false;
    if(S.tag && !d.tags.includes(S.tag)) return false;
    if(S.sig && d.signal!==S.sig) return false;
    if(S.day && d.date!==S.day) return false;
    if(S.q){
      const q = S.q.toLowerCase();
      const hay = (d.title+' '+(d.summary||'')+' '+(d.action||'')+' '+d.tags.join(' ')+' '+d.signal+' '+d.src).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  }
  const view = ()=> DATA.filter(match);

  /* ---- calendar ---- */
  function renderCal(){
    const [y,m] = S.month.split('-').map(Number);
    $('#mtitle').textContent = `${y} 年 ${m} 月`;
    const first = new Date(y,m-1,1);
    const startOffset = (first.getDay()+6)%7;           // Monday-first
    const gridStart = new Date(y,m-1,1-startOffset);
    const byDay = {};
    DATA.forEach(d=>{ (byDay[d.date] = byDay[d.date]||[]).push(d); });
    for(const k in byDay) byDay[k].sort((a,b)=>b.imp-a.imp);

    let html='';
    for(let i=0;i<42;i++){
      const dt = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate()+i);
      const key = ymd(dt);
      const out = dt.getMonth()!==m-1;
      const evs = byDay[key]||[];
      const dl = evs.some(e=>e.deadline===key);
      const hol = HOL[key];
      const cls = ['cell']; if(out) cls.push('out'); if(key===TODAY) cls.push('today');
      if(key===S.day) cls.push('sel');
      if(hol) cls.push(hol.type==='off'?'off':'work');
      const shown = evs.slice(0,2).map(e=>
        `<span class="ev" data-g="${esc(e.g)}" data-id="${esc(e.id)}" title="${esc(e.title)}">${esc(e.title)}</span>`).join('');
      const more = evs.length>2 ? `<span class="more" data-day="${key}">+${evs.length-2} 更多</span>` : '';
      const fest = hol ? `<div class="fest${hol.type==='work'?' work':''}" title="${esc(hol.name)}${hol.type==='work'?'（调休上班）':'（法定假日）'}">${esc(hol.name)}</div>` : '';
      html += `<div class="${cls.join(' ')}" data-day="${key}">
        <div class="dn">${dt.getDate()}</div>${fest}${dl?'<span class="dl">截止</span>':''}${shown}${more}</div>`;
    }
    $('#grid').innerHTML = html;
  }

  /* ---- list ---- */
  function renderList(){
    const rows = view().slice().sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:(b.imp-a.imp));
    $('#listtitle').textContent = S.day ? (S.day+' 的动态 · '+rows.length+' 条') : ('全部动态 · '+rows.length+' 条');
    $('#clearday').hidden = !S.day;
    if(!rows.length){
      const h = S.day && HOL[S.day];
      $('#list').innerHTML = h
        ? `<div class="empty">${esc(S.day)} 是「${esc(h.name)}」${h.type==='work'?'（调休上班）':'（法定假日）'}，这天没有政策发布。</div>`
        : '<div class="empty">没有匹配的条目，试试放宽筛选或换个关键词。</div>';
      return;
    }
    const groups = {};
    rows.forEach(r=>{ (groups[r.date] = groups[r.date]||[]).push(r); });
    $('#list').innerHTML = Object.keys(groups).sort().reverse().map(day=>{
      const cards = groups[day].map(d=>{
        const stars = '★'.repeat(d.imp)+'☆'.repeat(5-d.imp);
        const dl = d.deadline ? `<span class="badge b-dead">${esc(d.deadline)} 截止</span>` : '';
        return `<div class="card" data-id="${esc(d.id)}" data-g="${esc(d.g)}">
          <div class="ct"><h4>${esc(d.title)}</h4>
            ${d.imp>=4?'<span class="badge b-hot">重点</span>':''}
            <span class="badge b-signal">${esc(d.signal)}</span>${dl}</div>
          <div class="cm">
            <span class="src">${esc(d.src)}</span><span>·</span><span>${esc(d.date)}</span>
            <span class="stars" title="重要度 ${d.imp}/5">${stars}</span>
            ${d.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}
          </div>
          ${(d.summary && d.summary !== d.title)?`<p class="sum">${esc(d.summary)}</p>`:''}
          ${d.action?`<p class="act">建议：${esc(d.action)}</p>`:''}
        </div>`;
      }).join('');
      return `<div class="dgroup"><div class="dlabel">${day}${HOL[day]?` · ${esc(HOL[day].name)}${HOL[day].type==='work'?'（班）':''}`:''} · ${groups[day].length} 条</div>${cards}</div>`;
    }).join('');
  }

  /* ---- drawer ---- */
  function open(id){
    const d = DATA.find(x=>x.id===id); if(!d) return;
    $('#dt').textContent = d.title;
    const dl = d.deadline ? `${d.deadline}（还剩 ${Math.round((new Date(d.deadline)-new Date(TODAY))/86400000)} 天）` : '未识别到截止日期';
    $('#dbody').innerHTML = `
      <dl class="kv">
        <dt>来源</dt><dd>${esc(d.src)}</dd>
        <dt>发布/事件日</dt><dd>${esc(d.date)}</dd>
        <dt>类型</dt><dd>${esc(d.signal)}${d.col?` <span class="tag">${esc(d.col)}</span>`:''}</dd>
        <dt>重要度</dt><dd><span class="stars">${'★'.repeat(d.imp)}${'☆'.repeat(5-d.imp)}</span></dd>
        <dt>截止时间</dt><dd>${esc(dl)}</dd>
        <dt>领域标签</dt><dd>${d.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join(' ')||'—'}</dd>
        <dt>分析引擎</dt><dd>${esc(d.engine)}</dd>
      </dl>
      <div class="sec"><h5>一句话摘要</h5><p>${esc(d.summary)||'—'}</p></div>
      <div class="sec"><h5>影响判断</h5><p>${esc(d.impact)||'—'}</p></div>
      <div class="sec"><h5>建议动作</h5><p>${esc(d.action)||'—'}</p></div>
      <div class="sec"><h5>正文摘录</h5><p style="color:var(--ink2);font-size:12.5px">${esc(d.raw)||'（列表页未提供正文，点开原文查看）'}</p></div>
      <a class="goto" href="${esc(d.url)}" target="_blank" rel="noopener">打开原文 ↗</a>`;
    $('#drawer').classList.add('on'); $('#drawer').setAttribute('aria-hidden','false');
    $('#mask').classList.add('on');
  }
  function close(){ $('#drawer').classList.remove('on'); $('#drawer').setAttribute('aria-hidden','true'); $('#mask').classList.remove('on'); }

  /* ---- events ---- */
  function render(){ renderCal(); renderList(); }

  $('#grid').addEventListener('click', e=>{
    const ev = e.target.closest('.ev'); if(ev){ open(ev.dataset.id); return; }
    const more = e.target.closest('.more');
    const cell = e.target.closest('.cell'); if(!cell) return;
    const key = more ? more.dataset.day : cell.dataset.day;
    S.day = (S.day===key) ? null : key;
    render(); 
    if(S.day) document.querySelector('.daybar').scrollIntoView({behavior:'smooth',block:'start'});
  });
  $('#list').addEventListener('click', e=>{
    const c = e.target.closest('.card'); if(c) open(c.dataset.id);
  });
  $('#q').addEventListener('input', e=>{ S.q = e.target.value.trim(); renderList(); });
  $('#onlyhot').addEventListener('click', e=>{
    S.onlyHot = !S.onlyHot; e.currentTarget.setAttribute('aria-pressed', S.onlyHot); renderList();
  });
  $('#tag').addEventListener('change', e=>{ S.tag=e.target.value; renderList(); });
  $('#sig').addEventListener('change', e=>{ S.sig=e.target.value; renderList(); });
  $('#clearday').addEventListener('click', ()=>{ S.day=null; render(); });
  $('#prev').addEventListener('click', ()=>{
    let [y,m]=S.month.split('-').map(Number); m--; if(m<1){m=12;y--;} S.month=y+'-'+pad(m); renderCal();
  });
  $('#next').addEventListener('click', ()=>{
    let [y,m]=S.month.split('-').map(Number); m++; if(m>12){m=1;y++;} S.month=y+'-'+pad(m); renderCal();
  });
  $('#todaybtn').addEventListener('click', ()=>{
    const d=new Date(); S.month=d.getFullYear()+'-'+pad(d.getMonth()+1); S.day=ymd(d); render();
  });
  $('#dx').addEventListener('click', close);
  $('#mask').addEventListener('click', close);
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') close(); if(e.key==='/'){e.preventDefault();$('#q').focus();} });

  /* ---- health ---- */
  function health(){
    const list = META.sources||[];
    const push = META.push ? `<span class="pushinfo">推送：${esc(META.push)}</span>` : '';
    $('#srchealth').innerHTML = '数据源巡检：' + list.map(s=>
      `<span class="${s.ok?'ok':'bad'}">${s.ok?'●':'○'} ${esc(s.name)}${s.n?` (${s.n})`:''}</span>`).join(' ') + push;
  }

  buildChips(); stats(); render(); health();
  if(META.month) S.month = META.month;
  // 支持 index.html#2026-10 直接跳到某月，便于书签
  const hm = (location.hash || "").match(/(20\d{2})-(\d{2})/);
  if(hm){ S.month = hm[1] + '-' + hm[2]; }
  renderCal();
})();
</script>
</body>
</html>
